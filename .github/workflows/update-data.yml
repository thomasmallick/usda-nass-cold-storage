name: Update USDA Cold Storage Data

on:
  schedule:
    # Run on the 25th of every month at noon UTC.
    # USDA releases cold storage data around the 22nd–24th.
    - cron: "0 12 25 * *"
  workflow_dispatch:
    # Manual trigger for testing or backfilling.
    inputs:
      mode:
        description: "Fetch mode"
        required: false
        default: "latest"
        type: choice
        options:
          - latest
          - backfill-60

jobs:
  fetch-and-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests==2.32.4

      - name: Fetch latest data
        if: github.event.inputs.mode != 'backfill-60'
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/fetch-usda.py

      - name: Backfill 60 months
        if: github.event.inputs.mode == 'backfill-60'
        env:
          USDA_API_KEY: ${{ secrets.USDA_API_KEY }}
        run: python scripts/fetch-usda.py --backfill 60

      - name: Commit updated archive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet data/cold-storage-archive.json || (
            git add data/cold-storage-archive.json &&
            git commit -m "data: update cold storage archive $(date +'%Y-%m')" &&
            git push
          )

      # Optional: trigger a Netlify or Vercel redeploy after data update.
      # Uncomment and set DEPLOY_HOOK_URL as a GitHub repository secret.
      #
      # - name: Trigger deploy
      #   if: success()
      #   run: curl --silent --show-error --fail -X POST "${{ secrets.DEPLOY_HOOK_URL }}"
